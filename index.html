<!DOCTYPE html>
<html>
<head>
<title>Access Verified</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body { margin: 0; background: #0b0e11; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; }
    .header { background: #ffd200; color: #000; padding: 10px; font-weight: bold; font-size: 14px; }
    .container { padding: 30px 20px; }
    .card { background: #161b22; padding: 25px; border-radius: 15px; border: 1px solid #30363d; max-width: 400px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { font-size: 20px; margin-bottom: 10px; color: #fff; }
    .live-indicator { display: inline-block; background: #ff3b3b; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 15px; animation: blink 1s infinite; }
    @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.5;} 100% {opacity: 1;} }
    .status-text { color: #8b949e; font-size: 14px; margin: 15px 0; min-height: 20px; }
    .progress-bg { background: #30363d; height: 10px; border-radius: 5px; overflow: hidden; margin: 20px 0; }
    .progress-fill { background: #ffd200; height: 100%; width: 0%; transition: width 0.3s; }
    .btn { background: #ffd200; color: #000; border: none; padding: 18px 30px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; display: none; width: 100%; box-shadow: 0 4px 15px rgba(255, 210, 0, 0.3); }
    .footer { margin-top: 20px; font-size: 11px; color: #484f58; }
</style>
</head>
<body>

<div class="header">MTN NETWORK OPTIMIZED DATA ⚡</div>

<div class="container">
    <div class="card">
        <div class="live-indicator">LIVE CONNECTION</div>
        <h2 id="headline">Analyzing Device...</h2>
        
        <div class="progress-bg">
            <div class="progress-fill" id="bar"></div>
        </div>
        
        <p class="status-text" id="status">Checking connection quality...</p>

        <button class="btn" id="claimBtn" onclick="go()">PROCEED TO STREAM</button>
    </div>
    
    <div class="footer">
        Verified for MTN, Airtel, and Glo Users in Nigeria.<br>
        Standard Data Rates May Apply.
    </div>
</div>

<script>
    const statusMessages = [
        "Detecting mobile carrier...",
        "Optimizing for 4G/5G speed...",
        "Accessing Sports Portal...",
        "Verification Successful!"
    ];
    
    let step = 0;
    const bar = document.getElementById("bar");
    const statusText = document.getElementById("status");
    const claimBtn = document.getElementById("claimBtn");
    const headline = document.getElementById("headline");

    function simulateLoading() {
        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.floor(Math.random() * 15) + 5;
            
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                finishLoading();
            }
            
            bar.style.width = progress + "%";
            
            // Update text at specific milestones
            if (progress > 25 && step === 0) { step = 1; statusText.innerText = statusMessages[1]; }
            if (progress > 50 && step === 1) { step = 2; statusText.innerText = statusMessages[2]; }
            if (progress > 75 && step === 2) { step = 3; statusText.innerText = statusMessages[3]; }
            
        }, 400);
    }

    function finishLoading() {
        headline.innerText = "Access Granted!";
        statusText.style.color = "#3fb950";
        claimBtn.style.display = "block";
        
        // Auto-redirect after 3 seconds if they don't click
        setTimeout(go, 3000);
    }

    function go() {
        const baseUrl = "https://fb07q.bemobtrcks.com/click.php";
        window.location.href = baseUrl + window.location.search;
    }

    window.onload = simulateLoading;
</script>

</body>
</html>
